BB_CONF_FRAGMENT_SUMMARY = "This configures local builds for jama"
BB_CONF_FRAGMENT_DESCRIPTION = "Extended description goes here"

SOURCE_MIRROR_URL_OE = "file:///OE/build/downloads"
SOURCE_MIRROR_URL_OE_ALL = "file:///OE-storage/mirror"
SOURCE_MIRROR_URL_LGE_ALL = "file:///OE-storage/mirror-lge"

RM_WORK_EXCLUDE = "webruntime lib32-webruntime webruntime-clang lib32-webruntime-clang nodejs lib32-nodejs"

require /OE/build/oe-builds.conf

DL_DIR = "/OE/lge/build/downloads"
SSTATE_DIR = "/OE/lge/build/sstate/walnascar"

BB_SIGNATURE_HANDLER = "OEEquivHash"
BB_HASHSERVE = "unix:///OE/lge/build/hashserv/hashserve.sock"

LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

# ERROR: Nothing RPROVIDES 'packagegroup-core-weston' (but /OE/lge/build/atlas/nodistro-walnascar/layers/oe-core/meta/recipes-graphics/images/core-image-weston.bb RDEPENDS on or otherwise requires it)
# packagegroup-core-weston was skipped: missing required distro feature 'wayland' (not in DISTRO_FEATURES)
DISTRO_FEATURES:append = " wayland"

# ERROR: Nothing RPROVIDES 'weston-xwayland' (but /OE/lge/build/atlas/nodistro-walnascar/layers/oe-core/meta/recipes-graphics/images/core-image-weston.bb RDEPENDS on or otherwise requires it)
# weston RPROVIDES weston-xwayland but was skipped: missing required distro feature 'opengl' (not in DISTRO_FEATURES)
DISTRO_FEATURES:append = " opengl"
